id: "pipeline_microstop_detection"
name: "Micro-stop Detection"
description: "Détecte les micro-arrêts (30s-3min) à partir des changements de statut"
version: "1.0"
enabled: true

trigger:
  type: "mqtt"
  function: "mqtt_subscribe"
  config:
    topic: "mindset/events/status-change"
    qos: 1

nodes:
  - id: "parse_event"
    name: "Parse Status Event"
    type: "transform"
    function: "parse_json"
    config: {}
    depends_on: ["trigger"]

  - id: "check_duration"
    name: "Check Duration (30s-3min)"
    type: "condition"
    function: "threshold"
    config:
      min: 30
      max: 180
    depends_on: ["parse_event"]

  - id: "add_context"
    name: "Add Machine Context"
    type: "transform"
    function: "enrich_context"
    config:
      context:
        - "work_center"
        - "duration_seconds"
    depends_on: ["check_duration"]

  - id: "publish_microstop"
    name: "Publish Micro-stop Event"
    type: "output"
    function: "mqtt_publish"
    config:
      topic: "mindset/events/micro-stop"
      qos: 1
    depends_on: ["add_context"]

  - id: "save_to_kg"
    name: "Save to Knowledge Graph"
    type: "output"
    function: "kg_save"
    config:
      confidence: 0.9
    depends_on: ["publish_microstop"]

output: "publish_microstop"