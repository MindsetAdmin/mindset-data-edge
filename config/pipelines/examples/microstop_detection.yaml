id: "pipeline_microstop_detection"
name: "Micro-stop Detection"
description: "Détecte les micro-arrêts (30s-3min) à partir des changements de statut"
version: "1.0"
enabled: true

trigger:
  type: "mqtt"
  function: "mqtt_subscribe"
  config:
    topic: "mindset/raw/ns=3;i=1014"
    qos: 1

nodes:
  - id: "state_machine"
    name: "State Machine"
    type: "transform"
    function: "state_machine"
    config:
      machine_id: "machine1"
    depends_on: ["trigger"]

  - id: "duration"
    name: "Duration"
    type: "calculate"
    function: "calculate_duration"
    config: {}
    depends_on: ["state_machine"]

  - id: "threshold"
    name: "Threshold (30s-3min)"
    type: "condition"
    function: "threshold"
    config:
      min: 30
      max: 180
    depends_on: ["duration"]

  - id: "mqtt_publish"
    name: "Publish Micro-stop"
    type: "output"
    function: "mqtt_publish"
    config:
      topic: "mindset/events/micro-stop"
      qos: 1
    depends_on: ["threshold"]

output: "mqtt_publish"
