id: "pipeline_opcua_to_uns"
name: "OPC-UA to UNS"
description: "Transforme les données OPC-UA brutes en UNS ISA-95 structuré"
version: "1.0"
enabled: true

trigger:
  type: "mqtt"
  function: "mqtt_subscribe"
  config:
    topic: "mindset/raw/#"
    qos: 1

nodes:
  - id: "uns_mapper"
    name: "UNS Mapper"
    type: "transform"
    function: "uns_mapper"
    config:
      site_id: "local-test"
      area: "area1"
    depends_on: ["trigger"]

  - id: "mqtt_publish"
    name: "Publish to UNS"
    type: "output"
    function: "mqtt_publish"
    config:
      topic: "mindset/site/local-test/area1"
      qos: 1
    depends_on: ["uns_mapper"]

output: "mqtt_publish"
