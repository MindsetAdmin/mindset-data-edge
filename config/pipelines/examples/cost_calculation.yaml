id: "pipeline_cost_calculation"
name: "Cost Calculation"
description: "Calcule le coût des micro-stops en euros"
version: "1.0"
enabled: true

trigger:
  type: "mqtt"
  function: "mqtt_subscribe"
  config:
    topic: "mindset/events/micro-stop"
    qos: 1

nodes:
  - id: "cost"
    name: "Cost"
    type: "calculate"
    function: "calculate_cost"
    config:
      hourly_rate: 85.0
      currency: "EUR"
    depends_on: ["trigger"]

# No mqtt_publish node — the output node's result auto-publishes (Entry 119).
output: "cost"
output_topic: "mindset/events/micro-stop-cost"
