# config/agent.yaml
site:
  name: "Local Test Site"
  id: "local-test"

#list of opc-ua endpoints to connect to
opcua:
  name: "Prosys"
  endpoint: "opc.tcp://localhost:53530/OPCUA/SimulationServer"
  security_mode: "None"
  security_policy: "None"

discovery:
  scan_timeout_seconds: 10
  noise_filter_hz: 10
  observation_seconds: 15

mqtt:
  broker: "tcp://localhost:1883"
  raw_topic_prefix: "mindset/raw"
  events_topic_prefix: "mindset/events"

cost:
  hourly_cost: 85.0
  theoretical_rate: 3600
  product_margin: 0.08
  energy_price: 0.12