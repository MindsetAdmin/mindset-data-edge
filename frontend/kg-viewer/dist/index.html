<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSet Data - Knowledge Graph Viewer</title>
  <script type="module" crossorigin src="/assets/index-CjQw9jTC.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CUNAErf3.css">
</head>
<body>
    <div id="app">
        <div class="app-container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="logo">
                    <h1>📊 MindSet Data</h1>
                    <p>Knowledge Graph Explorer</p>
                </div>
                
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">📦 Nœuds</span>
                        <span class="stat-value" id="node-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">🔗 Relations</span>
                        <span class="stat-value" id="edge-count">0</span>
                    </div>
                </div>
                
                <div class="controls">
                    <button id="btn-fit" title="Ajuster la vue">🔍 Fit</button>
                    <button id="btn-zoom-in" title="Zoom +">➕</button>
                    <button id="btn-zoom-out" title="Zoom -">➖</button>
                    <button id="btn-reset" title="Réinitialiser">🔄 Reset</button>
                    <button id="btn-refresh" title="Rafraîchir">⬇️ Refresh</button>
                </div>
                
                <div class="legend">
                    <h4>Légende</h4>
                    <div class="legend-item">
                        <span class="legend-color connection"></span>
                        <span>Connection</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color topic"></span>
                        <span>Topic</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color function"></span>
                        <span>Function</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color pipeline"></span>
                        <span>Pipeline</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color dashboard"></span>
                        <span>Dashboard</span>
                    </div>
                </div>
                
                <div class="footer">
                    <p>Powered by Cytoscape.js</p>
                </div>
            </aside>
            
            <!-- Main content -->
            <main class="main-content">
                <div class="graph-container">
                    <div id="cy"></div>
                </div>
                
                <!-- Node Details Panel -->
                <div class="details-panel" id="details-panel">
                    <div class="details-header">
                        <h3>📋 Détails du nœud</h3>
                        <button id="close-details" class="close-btn">×</button>
                    </div>
                    <div class="details-content" id="details-content">
                        <p>Sélectionnez un nœud pour voir ses détails</p>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
</body>
</html>
